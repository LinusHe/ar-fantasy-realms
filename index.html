<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>Fantasy Realms – Wertungs-App</title>
  <meta name="description" content="Offlinefähige Wertungs-App für Fantasy Realms.">
  <meta name="author" content="Jimmy Praet">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="msapplication-TileColor" content="#0b0714">
  <meta name="msapplication-TileImage" content="icons/ms-icon-144x144.png">
  <meta name="theme-color" content="#0b0714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantasy Realms">
  <link rel="apple-touch-icon" sizes="57x57" href="icons/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="icons/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="icons/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="icons/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="icons/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icons/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/designs.css">
  <script>
    try {
      document.documentElement.dataset.design = localStorage.getItem('fr-design') === 'classic' ? 'classic' : 'modern';
    } catch (_) { document.documentElement.dataset.design = 'modern'; }
  </script>
  <script src="js/jquery-3.6.0.min.js"></script>
  <script src="js/jquery.i18n.properties.min.js"></script>
  <script src="js/handlebars.min-v4.7.7.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/discard.js"></script>
  <script src="js/hand.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vendor/gsap.min.js" defer></script>
</head>

<body>
  <!-- ===== Handlebars templates ===== -->
  <script id="cards-template" type="text/x-handlebars-template">
    {{#each suits}}
    <section class="fr-group {{@key}}" data-suit="{{@key}}">
      <button class="fr-group-head" type="button" data-suit="{{@key}}">
        <span class="fr-suit-dot"></span>
        <span class="fr-group-name">{{{i18n 'suit.' @key}}}</span>
        <span class="fr-group-count">{{this.length}}</span>
        <svg class="fr-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="fr-group-body">
        <ul class="fr-card-list">
          {{#each this}}
          <li class="fr-card {{suit}}" data-id="{{id}}" role="button" tabindex="0">
            <span class="fr-str">{{strength}}</span>
            <span class="fr-card-name">{{{i18n id '.name'}}}</span>
            <span class="fr-add">+</span>
          </li>
          {{/each}}
        </ul>
      </div>
    </section>
    {{/each}}
  </script>

  <script id="suit-selection-template" type="text/x-handlebars-template">
    <div class="fr-suit-picker">
      {{#each suits}}
      <button type="button" class="fr-suit-choice {{this}}" onclick="selectSuit('{{this}}')">
        <span class="fr-suit-dot"></span>{{{i18n 'suit.' this}}}
      </button>
      {{/each}}
    </div>
  </script>

  <script id="hand-template" type="text/x-handlebars-template">
    {{#each playerCards}}
    <div id="card-{{id}}" class="card" onclick="selectFromHand('{{id}}')">
      <ul class="list-group">
        <li class="list-group-item {{suit}} {{#if blanked}}blanked{{/if}}">
          <span class="badge badge-secondary">
            {{#if blanked}}
              {{i18n 'label.blanked'}}
            {{else}}
              {{strength}}
            {{/if}}
          </span>
          {{#if impersonator}}
            {{#if magic}}
              {{{i18n actionData.[0] '.name'}}}
            {{else}}
              {{{i18n id '.name'}}}
            {{/if}}
          {{else}}
            {{{i18n id '.name'}}}
          {{/if}}
          {{#if magic}}
          *
          {{/if}}
          <span class="float-right points">{{points}}</span>
        </li>
        {{#if timing}}
        <li class="list-group-item timing">
          <b>{{{i18n 'timing.' timing}}}:</b>
        </li>
        {{/if}}
        {{#if bonus}}
        <li class="list-group-item bonus {{#if blanked}}blanked{{/if}}">
          {{{i18n id '.bonus'}}}
          {{#if bonusPoints}}
          <span class="float-right bonus">+{{bonusPoints}}</span>
          {{/if}}
        </li>
        {{/if}}
        {{#if penalty}}
        <li class="list-group-item penalty {{#if blanked}}blanked{{/if}} {{#if penaltyCleared}}cleared{{/if}}">
          {{#if card.penalty}}
            {{{i18n id '.penalty'}}}
          {{else}}
            <!-- Doppelgänger penalty -->
            {{{i18n actionData.[0] '.penalty'}}}
          {{/if}}
          {{#if penaltyPoints}}
          <span class="float-right penalty">{{penaltyPoints}}</span>
          {{/if}}
        </li>
        {{/if}}
        {{#if card.action}}
        <li class="list-group-item action-row">
            <span id="card-action-text-{{id}}"></span>
            <button id="card-action-use-{{id}}" type="button" class="btn btn-sm btn-primary float-right" onclick="event.stopPropagation(); useCardAction('{{id}}');">{{{i18n 'button.use'}}}</button>
            <button id="card-action-cancel-{{id}}" style="display: none;" type="button" class="btn btn-sm btn-secondary float-right" onclick="event.stopPropagation(); cancelCardAction('{{id}}');">{{i18n 'button.cancel'}}</button>
        </li>
        {{/if}}
        {{#if card.referencesPlayerCount}}
        <li class="list-group-item action-row">
          <span id="card-action-text-{{id}}">
            {{i18n 'label.player-count'}} ({{../playerCount}}):
            {{#each ../playerCounts}}
              <button type="button" class="btn btn-sm btn-primary" onclick="event.stopPropagation(); setPlayerCount({{this}});">{{this}}</button>
            {{/each}}
          </span>
        </li>
        {{/if}}
        {{#if card.referencesDiscardArea}}
        <li class="list-group-item action-row">
          <button type="button" onclick="event.stopPropagation(); switchToDiscardArea('{{id}}');" class="btn btn-sm btn-primary float-right">{{i18n 'button.discard-area'}}</button>
        </li>
        {{/if}}
      </ul>
    </div>
    {{/each}}
  </script>

  <script id="discard-template" type="text/x-handlebars-template">
    <div id="discard-header">
      <span>{{i18n 'label.discard-area'}}</span>
      <button type="button" onclick="event.stopPropagation(); switchToHand();" class="btn btn-sm btn-primary float-right">{{i18n 'button.back-to-hand'}}</button>
    </div>
    {{#each discard}}
    <div id="discard-{{id}}" class="card" onclick="removeFromDiscard('{{id}}')">
      <ul class="list-group">
        <li class="list-group-item {{suit}}">
          {{i18n id '.name'}}
        </li>
      </ul>
    </div>
    {{/each}}
  </script>

  <!-- ===== App shell ===== -->
  <div id="app">
    <header class="fr-header">
      <div class="fr-brand">
        <img class="fr-classic-logo" src="img/fantasy-realms.jpg" alt="Fantasy Realms">
        <span class="fr-title">Fantasy&nbsp;Realms</span>
        <span class="fr-subtitle">Wertungs-App</span>
      </div>
      <div class="fr-hud">
        <div class="fr-count"><span id="cardCount">0</span><span class="sep">/</span><span id="cardLimit">7</span></div>
        <div class="fr-orb"><span id="points">000</span></div>
      </div>
      <div class="fr-actions">
        <button id="open-settings" class="fr-icon-btn" type="button" title="Einstellungen" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="clear" class="fr-icon-btn fr-reset" type="button" onclick="reset()" title="Zurücksetzen" aria-label="Zurücksetzen">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>
    </header>

    <main class="fr-main">
      <section class="fr-panel-deck">
        <div class="fr-search">
          <svg class="fr-search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="card-search" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Karten suchen…">
          <button id="card-search-clear" class="fr-search-clear" type="button" aria-label="Suche leeren" style="display:none">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div id="cards" class="fr-deck"></div>
        <div id="fr-no-results" class="fr-no-results" style="display:none">Keine Karten gefunden</div>

        <footer class="fr-footer">
          <a href="https://wizkids.com/"><img src="img/wizkids.png" alt="WizKids"></a>
          <span class="fr-legal">©2021 WizKids/NECA LLC. WizKids and related marks and logos are trademarks of WizKids. All rights reserved.</span>
        </footer>
      </section>

      <div id="sheet-scrim" class="fr-scrim"></div>

      <aside id="hand-sheet" class="fr-sheet">
        <button id="sheet-bar" class="fr-sheet-bar" type="button">
          <span class="fr-grabber" aria-hidden="true"></span>
          <span class="fr-sheet-title">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"></path><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
            <span id="hand-label">Hand</span>
            <span id="sheet-count" class="fr-pill">0/7</span>
          </span>
          <span id="sheet-points" class="fr-sheet-points">000</span>
          <svg class="fr-sheet-caret" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <div class="fr-sheet-body">
          <div id="hand" class="fr-hand is-empty"></div>
          <div id="discard" class="fr-discard"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ===== Settings modal ===== -->
  <div id="settings-modal" class="fr-modal">
    <div class="fr-modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="fr-modal-head">
        <h2 id="settings-title">Einstellungen</h2>
        <button id="close-settings" class="fr-icon-btn" type="button" aria-label="Schließen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="settings">
        <div class="fr-set-block">
          <span id="design-label">Design</span>
          <div class="fr-design-options" role="group" aria-labelledby="design-label">
            <button type="button" data-design-choice="modern" aria-pressed="true">Modern</button>
            <button type="button" data-design-choice="classic" aria-pressed="false">Klassisch</button>
          </div>
        </div>
        <div class="fr-set-block">
          <div class="fr-set-block-head">
            <img src="img/cursed-hoard.png" alt="Verfluchter Schatz">
            <span id="expansion-title">Verfluchter Schatz</span>
          </div>
          <label class="fr-switch" for="ch_items">
            <span id="lbl_ch_items">Verfluchte Gegenstände</span>
            <input type="checkbox" id="ch_items">
            <span class="fr-slider"></span>
          </label>
          <label class="fr-switch" for="ch_suits">
            <span id="lbl_ch_suits">Gebäude/Outsider/Untote</span>
            <input type="checkbox" id="ch_suits">
            <span class="fr-slider"></span>
          </label>
        </div>

        <div class="fr-set-block">
          <div id="language" class="fr-dropdown">
            <button class="fr-dropbtn" type="button" id="language-selector">
              <img src="img/globe.png" alt="">
              <span id="selected-language">Deutsch</span>
              <svg class="caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="fr-dropmenu">
              <a id="lang-en" class="dropdown-item" href="#" onclick="selectLanguage('en')">English</a>
              <a id="lang-de" class="dropdown-item" href="#" onclick="selectLanguage('de')">Deutsch</a>
              <a id="lang-es" class="dropdown-item" href="#" onclick="selectLanguage('es')">Español</a>
              <a id="lang-fr" class="dropdown-item" href="#" onclick="selectLanguage('fr')">Français</a>
              <a id="lang-pl" class="dropdown-item" href="#" onclick="selectLanguage('pl')">Polski</a>
              <a id="lang-pt" class="dropdown-item" href="#" onclick="selectLanguage('pt')">Português</a>
              <a id="lang-ua" class="dropdown-item" href="#" onclick="selectLanguage('ua')">Українська</a>
              <a id="lang-cz" class="dropdown-item" href="#" onclick="selectLanguage('cz')">Čeština</a>
              <a id="lang-kr" class="dropdown-item" href="#" onclick="selectLanguage('kr')">한국어</a>
              <a id="lang-ru" class="dropdown-item" href="#" onclick="selectLanguage('ru')">Русский</a>
              <a id="lang-zh" class="dropdown-item" href="#" onclick="selectLanguage('zh')">中文</a>
            </div>
          </div>

          <label class="fr-switch" for="sound_state">
            <span id="sound-label">Ton</span>
            <input type="checkbox" id="sound_state" checked>
            <span class="fr-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      // Auto-reload once when an updated service worker takes control,
      // so a new deploy is picked up without a manual hard-refresh.
      var frReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (frReloading) return;
        frReloading = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('/service-worker.js').then(function (reg) {
        return reg.update();
      }).catch(function () {
        // Offline launches keep using the already installed worker.
      });

      // The cached shell remains usable without a network connection. When
      // online, a lightweight uncached probe notices an expired login cookie.
      function checkSession() {
        if (!navigator.onLine) return;
        fetch('/login', { cache: 'no-store' }).then(function (response) {
          if (response.headers.get('X-Login')) window.location.href = '/login';
        }).catch(function () {});
      }
      window.addEventListener('online', checkSession);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') checkSession();
      });
      checkSession();
    }
  </script>
</body>

</html>
